[project]
name = "gdai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiopath>=0.7.7",
    "asyncpg>=0.30.0",
    "boto3>=1.40.15",
    "chonkie[all]>=1.1.1",
    "clean-text>=0.6.0",
    "click>=8.1.8",
    "cohere>=5.15.0",
    "langchain[openai]>=0.3.25",
    "langgraph>=0.4.7",
    "mkdocs>=1.6.1",
    "mkdocs-dracula-theme>=1.0.7",
    "openai>=1.82.1",
    "pgvector>=0.4.1",
    "pre-commit>=4.2.0",
    "pydantic-settings>=2.11.0",
    "pymupdf>=1.26.3",
    "python-dotenv>=1.1.0",
    "rich>=13.9.4",
    "scipy>=1.15.2",
    "sqlalchemy>=2.0.41",
    "streamlit>=1.44.0",
    "taskipy>=1.14.1",
    "temporalio>=1.15.0",
    "types-aiofiles>=24.1.0.20250606",
    "unidecode>=1.4.0",
]


[dependency-groups]
dev = ["ruff>=0.8.0"]
test = ["pytest>=8.4.0", "pytest-cov>=6.2.1", "pre-commit>=4.2.0", "pytest-asyncio>=0.26.0"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "ARG"]
ignore = ["E203", "D203", "D213", "D212", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ERA001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.pydocstyle]
convention = "google" # Use Google style to docstrings


[tool.pytest.ini_options]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*swigvarlink has no __module__ attribute:DeprecationWarning:importlib._bootstrap",
    "ignore:.*SwigPyObject has no __module__ attribute:DeprecationWarning:importlib._bootstrap",
    "ignore:.*SwigPyPacked has no __module__ attribute:DeprecationWarning:importlib._bootstrap",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning:sys",
    "ignore::DeprecationWarning:multiprocessing.*:",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"


[tool.taskipy.tasks]

# Development environment
configure-dev = { cmd = "uv sync --all-groups && pre-commit install && pre-commit install --hook-type pre-push", help = "Configure the development environment" }
dev = { cmd = "./gdai/scripts/dev.sh", help = "Start complete development environment (infrastructure + workers + API)" }
dev-infra = { cmd = "./gdai/scripts/dev.sh infra", help = "Start only infrastructure services (PostgreSQL, Temporal, MinIO)" }

# Database management
reset-db = { cmd = "uv run python gdai/scripts/reset_db.py", help = "Reset the database (DANGER: This will delete all data!)" }
setup-db = { cmd = "uv run python gdai/scripts/setup_db.py", help = "Setup the database (create tables)" }

# Testing
tests = { cmd = "./gdai/scripts/tests.sh", help = "Run all tests with coverage" }
tests-unit = { cmd = "./gdai/scripts/tests.sh unit", help = "Run unit tests only" }
tests-integration = { cmd = "./gdai/scripts/tests.sh integration", help = "Run integration tests only" }
tests-quick = { cmd = "./gdai/scripts/tests.sh quick", help = "Run quick test suite (unit, no coverage)" }

# Temporal workers
temporal-all = { cmd = "uv run python -m gdai.temporal.main", help = "Run all Temporal workers (LLM, embedding, extraction, search)" }
temporal-llm = { cmd = "uv run python -m gdai.temporal.conversational_llm.worker", help = "Run LLM worker (queue: llm-queue)" }
temporal-embed = { cmd = "uv run python -m gdai.temporal.embedding_texts.worker", help = "Run embedding worker (queue: embedding-text-queue)" }
temporal-extract = { cmd = "uv run python -m gdai.temporal.extract_document.worker", help = "Run extraction worker (queue: process-document-queue)" }
temporal-search = { cmd = "uv run python -m gdai.temporal.search_on_documents.worker", help = "Run search worker (queue: search-on-documents-queue)" }

# Documentation
docs-update = { cmd = "./gdai/scripts/update_docs.sh", help = "Update MkDocs documentation from main files" }
docs-serve = { cmd = "uv run mkdocs serve", help = "Start MkDocs development server (http://localhost:8000)" }
docs-build = { cmd = "uv run mkdocs build", help = "Build static documentation site" }
docs-deploy = { cmd = "uv run mkdocs gh-deploy --force", help = "Deploy documentation to GitHub Pages" }
