name: Coverage Badge

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  coverage:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: vectordb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest \
            server /data

          echo "Waiting for MinIO to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live 2>/dev/null; then
              echo "MinIO is ready!"
              break
            fi
            echo "Attempt $i/30: MinIO not ready yet..."
            sleep 2
          done

      - name: Create .env file
        run: |
          cat > .env << EOF
          DATABASE=pgvector
          PGVECTOR_USER=testuser
          PGVECTOR_PASSWORD=testpwd
          PGVECTOR_DATABASE=vectordb
          PGVECTOR_HOST=localhost
          PGVECTOR_PORT=5432
          PGVECTOR_MIN_POOL_CONNECTIONS=2
          PGVECTOR_MAX_POOL_CONNECTIONS=10
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          S3_BUCKET=gdai-documents
          S3_REGION=us-east-1
          S3_USE_SSL=false
          EMBEDDING_DIMENSION=1536
          TEMPORAL_HOST=localhost
          TEMPORAL_PORT=7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=gdai-task-queue
          GDAI_LOG_LEVEL=INFO
          EOF

      - name: Setup database
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python gdai/scripts/setup_db.py

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/ \
            --cov=gdai \
            --cov-report=term \
            --cov-report=json:coverage.json \
            -q

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python3 -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Update README badge
        if: github.ref == 'refs/heads/temporalio-structure' || github.ref == 'refs/heads/main'
        run: |
          COVERAGE=${{ steps.coverage.outputs.percentage }}

          # Determine color based on coverage
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          # Update README.md
          sed -i "s|!\[Coverage\](https://img.shields.io/badge/coverage-[0-9]*%25-[a-z]*)|![Coverage](https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR})|g" README.md

          echo "Updated badge to: ${COVERAGE}% (${COLOR})"

      - name: Commit and push if changed
        if: github.ref == 'refs/heads/temporalio-structure' || github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "chore: update coverage badge to ${{ steps.coverage.outputs.percentage }}%"
            git push
          fi
