name: Tests and Coverage

on:
  push:
    branches: [main, develop, temporalio-structure]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: vectordb_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        volumes:
          - /tmp/minio-data:/data
        command: server /data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Create test environment file
        run: |
          cat > .env << EOF
          # Database
          DATABASE=pgvector
          PGVECTOR_USER=testuser
          PGVECTOR_PASSWORD=testpwd
          PGVECTOR_DATABASE=vectordb_test
          PGVECTOR_HOST=localhost
          PGVECTOR_PORT=5432
          PGVECTOR_MIN_POOL_CONNECTIONS=2
          PGVECTOR_MAX_POOL_CONNECTIONS=10

          # S3/MinIO
          S3_ENDPOINT=http://localhost:9000
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          S3_BUCKET=gdai-test
          S3_REGION=us-east-1
          S3_USE_SSL=false

          # Extractor
          EXTRACTOR_TMP_FOLDER=/tmp/gdai-test
          EXTRACTOR_MAX_FILE_SIZE_MB=100
          EXTRACTOR_MAX_RETRIES=3

          # Embedding (mocked in tests)
          EMBEDDING_MAX_TEXT_SIZE=5000
          EMBEDDING_MAX_RETRIES=3
          EMBEDDING_MODEL=cohere/embed-v4.0
          EMBEDDING_API_KEY=test-key
          EMBEDDING_DIMENSION=1536
          EMBEDDING_BATCH_SIZE=96

          # LLM (mocked in tests)
          LLM_MODEL=openai/gpt-4o
          LLM_API_KEY=test-key
          LLM_MAX_TOKENS=2000
          LLM_TEMPERATURE=0.7

          # Temporal
          TEMPORAL_HOST=localhost:7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=gdai-task-queue

          # Logging
          GDAI_LOG_LEVEL=INFO
          EOF

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U testuser && break
            sleep 1
          done

          echo "Waiting for MinIO..."
          for i in {1..30}; do
            curl -f http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run linting
        run: |
          uv run ruff check gdai/

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run pytest tests/ \
            --cov=gdai \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            --tb=short \
            --maxfail=5

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage report available in artifacts." >> $GITHUB_STEP_SUMMARY
